<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OPEN Coin Mining</title>
<script src="https://unpkg.com/@tonconnect/ui@3.0.0/dist/tonconnect-ui.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI,Tahoma,Verdana,sans-serif}html,body{height:100%;background:#0b0e14;color:#fff}body{overflow:hidden;background-image:radial-gradient(circle at center,#231c0a 0%,#0b0e14 80%)}button{font:inherit}.main{width:100%;max-width:480px;height:100%;margin:auto;display:flex;flex-direction:column;padding:15px;gap:0}.header{display:flex;justify-content:space-between;align-items:center}.user{display:flex;align-items:center;gap:10px}.avatar{width:40px;height:40px;border-radius:50%;background:#d4af37;color:#000;display:grid;place-items:center;font-weight:800}.name{font-size:15px;font-weight:600}.badge,.wallet{background:#1e293b;border:1px solid #334155;color:#facc15;border-radius:20px}.badge{display:inline-block;padding:3px 9px;font-size:11px;margin-top:3px}.wallet{padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer}.assets{text-align:center;margin-top:8px}.title{font-size:11px;letter-spacing:1.5px;color:#94a3b8;margin-bottom:4px}.balance{font-size:28px;font-weight:800}.balance span{color:#facc15}.speed{font-size:12px;color:#00ffcc;margin-top:4px}.row{display:flex;justify-content:center;gap:10px;margin-top:8px}.card{background:#1e293bcc;border:1px solid #334155;padding:6px 12px;border-radius:12px;font-size:11px;color:#94a3b8}.card span{color:#facc15;font-weight:700}.coinarea{flex:1;display:flex;justify-content:center;align-items:center;position:relative}.glow{position:absolute;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.2),transparent 70%)}.coin{width:180px;height:180px;border-radius:50%;background:linear-gradient(135deg,#fef08a,#ca8a04 50%,#713f12);border:6px solid #fde047;box-shadow:0 0 30px rgba(202,138,4,.5),inset 0 0 15px rgba(255,255,255,.6);display:grid;place-items:center;z-index:2;cursor:pointer;transition:transform .1s}.coin:active{transform:scale(.95)}.inner{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#eab308,#854d0e);border:2px dashed #ffffff4d;display:grid;place-items:center}.cointext{font-size:32px;font-weight:900;color:#1e1b4b;letter-spacing:2px}.actions{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}.primary,.secondary{width:100%;border-radius:14px;font-weight:800;cursor:pointer}.primary{border:0;padding:14px;background:linear-gradient(90deg,#facc15,#ca8a04);color:#0f172a;box-shadow:0 4px 15px #ca8a0466}.primary:disabled{opacity:.5;cursor:not-allowed}.secondary{padding:12px;background:#1e293b;color:#38bdf8;border:1px solid #334155}.timer{text-align:center;font-size:12px;color:#94a3b8;min-height:17px}.nav{display:flex;justify-content:space-around;background:#121824;border-top:1px solid #1e293b;padding:8px 0;border-radius:16px 16px 0 0}.nav button{background:none;border:0;color:#64748b;font-size:11px}.nav button.active{color:#facc15}.nav svg{width:20px;height:20px;display:block;margin:auto;fill:currentColor}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:20}.sheet{width:min(480px,100%);background:#111827;border:1px solid #334155;border-radius:20px 20px 0 0;padding:18px}.sheet h2{font-size:18px;margin-bottom:12px}.sheet p{color:#94a3b8;font-size:13px;margin:7px 0}.input{width:100%;padding:12px;border-radius:12px;background:#0b0e14;color:#fff;border:1px solid #334155;margin:8px 0}.close{width:100%;padding:11px;border:1px solid #334155;border-radius:12px;background:#1e293b;color:#fff;margin-top:8px}.status{font-size:12px;color:#94a3b8;margin-top:8px;word-break:break-all}.toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);background:#111827;border:1px solid #334155;padding:10px 14px;border-radius:12px;display:none;z-index:50;font-size:12px;max-width:90%}
</style></head>
<body><main class="main">
<header class="header"><div class="user"><div class="avatar">U</div><div><div class="name">Crypto Miner</div><div class="badge" id="friendBadge">Friends: 0 (+0% Speed)</div></div></div><button class="wallet" id="walletBtn">Connect Wallet</button></header>
<section class="assets"><div class="title">ASSETS</div><div class="balance"><span id="balance">0.0000</span> OPEN</div><div class="speed">Mining Speed: <span id="speed">0.0010</span> OPEN/h</div><div class="row"><div class="card">MINED: <span id="mined">0.0000</span> OPEN</div><div class="card">BONUS: <span id="bonus">0</span>%</div></div></section>
<section class="coinarea"><div class="glow"></div><div class="coin" id="coin"><div class="inner"><div class="cointext">OPEN</div></div></div></section>
<section class="actions"><button class="primary" id="claimBtn" disabled>START 24H MINING</button><button class="secondary" id="shareBtn">SHARE & BOOST SPEED (+10%)</button><div class="timer" id="timer">Connect wallet to continue</div></section>
<nav class="nav"><button class="active" id="mineTab"><svg viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>Mine</button><button id="friendsTab"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>Friends</button><button id="walletTab">Wallet</button></nav>
</main>
<div class="modal" id="walletModal"><div class="sheet"><h2>Wallet</h2><p>Connected wallet</p><div class="status" id="walletAddress">Not connected</div><button class="secondary" id="depositBtn">Deposit 0.01 TON → +10% speed</button><button class="secondary" id="sendBtn">Send OPEN</button><button class="secondary" id="swapBtn">Swap</button><button class="close" id="closeModal">Close</button></div></div><div class="toast" id="toast"></div>
<script>
const API='/api';let tc,account=null,verified=false,state=null,depositInvoice=null;
const $=id=>document.getElementById(id);function toast(m){$('toast').textContent=m;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3500)}
async function api(path,opt={}){const r=await fetch(API+path,{credentials:'include',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
async function init(){try{const nonce=await api('/auth/nonce');tc=new TON_CONNECT_UI.TonConnectUI({manifestUrl:'/tonconnect-manifest.json'});tc.setConnectRequestParameters({state:'ready',value:{tonProof:nonce.nonce}});tc.onStatusChange(async w=>{account=w?.account||null;if(!account){verified=false;state=null;render();return}const proof=w.connectItems?.tonProof;if(!proof||!('proof' in proof)){toast('Wallet did not return TON proof. Reconnect.');return}try{await api('/auth/verify',{method:'POST',body:JSON.stringify({proof:proof.proof,address:account.address,walletStateInit:account.walletStateInit,network:account.chain})});verified=true;toast('Wallet verified');await load();}catch(e){verified=false;toast(e.message)}render()});await tc.connectionRestored;account=tc.account;render();}catch(e){toast(e.message)}}
$('walletBtn').onclick=()=>tc?.openModal();
async function load(){if(!verified)return;state=await api('/me');render();const ref=new URLSearchParams(location.search).get('ref');if(ref){try{await api('/referral/attach',{method:'POST',body:JSON.stringify({code:ref})});history.replaceState({},'',location.pathname);toast('Referral attached')}catch(e){}}}
function render(){if(account){$('walletBtn').textContent=account.address.slice(0,5)+'...'+account.address.slice(-5);$('walletAddress').textContent=account.address}else{$('walletBtn').textContent='Connect Wallet';$('walletAddress').textContent='Not connected'}if(state){$('balance').textContent=Number(state.balance).toFixed(4);$('mined').textContent=Number(state.balance).toFixed(4);$('friendBadge').textContent=`Friends: ${state.successfulReferrals} (+${state.referralBonusPercent}% Speed)`;$('bonus').textContent=state.totalBonusPercent;$('speed').textContent=state.speed.toFixed(4);updateTimer()}else{$('timer').textContent='Connect and verify wallet to continue';$('claimBtn').disabled=true}}
function updateTimer(){if(!state)return;const left=state.nextClaimAt?new Date(state.nextClaimAt).getTime()-Date.now():0;if(state.miningActive&&left>0){$('claimBtn').disabled=true;$('claimBtn').textContent='MINING ACTIVE';$('timer').textContent='Next 24H claim in: '+fmt(left)}else{$('claimBtn').disabled=!verified;$('claimBtn').textContent='START 24H MINING';$('timer').textContent=verified?'Click once to start mining for 24 hours':'Connect wallet to continue'}}function fmt(ms){let s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return `${h}h ${m}m ${x}s`}
$('claimBtn').onclick=async()=>{try{state=await api('/mining/start',{method:'POST'});toast('24H mining started');render()}catch(e){toast(e.message)}};
$('coin').onclick=()=>toast('Mining accrues automatically. No fake tap rewards.');
$('shareBtn').onclick=async()=>{try{const d=await api('/referral/link');await navigator.clipboard?.writeText(d.url);if(navigator.share)await navigator.share({title:'OPEN Coin',text:'Join OPEN Coin',url:d.url});else toast('Referral link copied');}catch(e){toast(e.message)}};
$('walletTab').onclick=()=>$('walletModal').style.display='flex';$('closeModal').onclick=()=>$('walletModal').style.display='none';
$('depositBtn').onclick=async()=>{try{depositInvoice=await api('/deposit/invoice',{method:'POST'});await tc.sendTransaction({validUntil:Math.floor(Date.now()/1000)+300,network:'-239',messages:[{address:depositInvoice.address,amount:depositInvoice.amountNano,payload:depositInvoice.payload}]});toast('Deposit sent. Waiting for blockchain verification…');let n=0;const poll=setInterval(async()=>{n++;try{const d=await api('/deposit/check',{method:'POST'});if(d.status==='confirmed'||n>=20){clearInterval(poll);await load();if(d.status==='confirmed')toast('0.01 TON deposit verified. +10% speed')}}catch(e){if(n>=20)clearInterval(poll)}},3000)}catch(e){toast(e.message)}};
$('sendBtn').onclick=()=>toast('Send is available after OPEN token contract/asset configuration.');$('swapBtn').onclick=()=>toast('Swap requires a configured DEX/router and token pair; no fake swap is performed.');
setInterval(()=>{if(state)updateTimer()},1000);init();
</script></body></html>
