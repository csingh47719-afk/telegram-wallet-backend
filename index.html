<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Coin Mining</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- TON Connect UI SDK -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0e14;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
        }
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            box-sizing: border-box;
        }
        #ton-connect {
            cursor: pointer;
        }
        .container {
            text-align: center;
            width: 100%;
            padding: 10px;
        }
        .user-info {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #f3ba2f;
        }
        .balance-box {
            font-size: 30px;
            font-weight: bold;
            margin: 10px 0;
            color: #0ecb81;
        }
        .speed-info {
            font-size: 13px;
            color: #f3ba2f;
            margin-bottom: 15px;
        }
        .coin-logo {
            width: 130px;
            height: 130px;
            background: linear-gradient(135deg, #f3ba2f, #b8860b);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
            color: #000;
            margin: 15px auto;
            box-shadow: 0 0 20px rgba(243, 186, 47, 0.5);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(243, 186, 47, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 25px rgba(243, 186, 47, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 15px rgba(243, 186, 47, 0.4); }
        }
        .claim-btn {
            width: 90%;
            max-width: 400px;
            padding: 14px;
            background-color: #f3ba2f;
            color: #000;
            font-size: 17px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(243, 186, 47, 0.3);
        }
        .boost-btn {
            width: 90%;
            max-width: 400px;
            padding: 10px;
            background-color: #2b313a;
            color: #f3ba2f;
            border: 1px solid #f3ba2f;
            font-size: 14px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .nav-bar {
            display: flex;
            justify-content: space-around;
            width: 100%;
            background-color: #161a25;
            padding: 12px 0;
            border-top: 1px solid #222;
        }
        .nav-item {
            font-size: 12px;
            color: #888;
            text-align: center;
        }
        .nav-item.active {
            color: #f3ba2f;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <!-- वास्तविक TON Connect वॉलेट बटन -->
        <div id="ton-connect"></div>
        <button style="background:none; border:none; color:#fff; cursor:pointer;" onclick="shareApp()">🔗 Share</button>
    </div>

    <div class="container">
        <div class="user-info" id="username">Loading...</div>
        <div style="font-size: 12px; color: #aaa;">MAIN BALANCE</div>
        
        <!-- केवल क्लेम करने पर अपडेट होने वाला मेन बैलेंस -->
        <div class="balance-box" id="mainBalance">0.0000 OPEN</div>
        <div class="speed-info" id="speedDisplay">Mining Speed: 0.0010 OPEN/h</div>

        <div class="coin-logo">OPEN</div>

        <!-- क्लेम बटन (क्लिक करने पर ही मेन बैलेंस में जुड़ेगा) -->
        <button class="claim-btn" id="claimBtn" onclick="claimMining()">CLAIM REWARD</button>
        <button class="boost-btn" onclick="verifyDeposit()">⚡ Boost Speed (Verify TON)</button>
    </div>

    <div class="nav-bar">
        <div class="nav-item active">⛏️ Mine</div>
        <div class="nav-item">📋 Tasks</div>
        <div class="nav-item">⚡ Miners</div>
        <div class="nav-item">👥 Friends</div>
        <div class="nav-item">👤 Profile</div>
    </div>

    <script>
        Telegram.WebApp.ready();
        const tgUser = Telegram.WebApp.initDataUnsafe?.user;
        const telegramId = tgUser ? tgUser.id : "123456789"; 
        document.getElementById('username').innerText = tgUser ? tgUser.first_name : "Open Miner";

        const BACKEND_URL = "https://telegram-wallet-backend-3.onrender.com";

        // TON Connect UI सेटअप
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://raw.githubusercontent.com/ton-connect/docs/main/media/manifest.json',
            buttonRootId: 'ton-connect'
        });

        // वॉलेट कनेक्शन ट्रैक करना
        tonConnectUI.onStatusChange(wallet => {
            if (wallet) {
                const walletAddress = wallet.account.address;
                fetch(`${BACKEND_URL}/api/connect-wallet`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: telegramId, wallet_address: walletAddress })
                });
            }
        });

        let mainBalance = 0.0000;
        let miningSpeed = 0.0010;

        function fetchUserData() {
            fetch(`${BACKEND_URL}/api/user?telegram_id=${telegramId}`)
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    mainBalance = data.main_balance;
                    miningSpeed = data.speed || 0.0010;
                    document.getElementById('speedDisplay').innerText = `Mining Speed: ${miningSpeed.toFixed(4)} OPEN/h`;
                    document.getElementById('mainBalance').innerText = mainBalance.toFixed(4) + " OPEN";
                }
            }).catch(err => console.error("Sync error:", err));
        }

        // क्लेम बटन पर क्लिक करने के बाद ही मेन बैलेंस अपडेट होगा
        function claimMining() {
            const btn = document.getElementById('claimBtn');
            btn.disabled = true;
            btn.innerText = "Processing...";

            fetch(`${BACKEND_URL}/api/claim`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegram_id: telegramId })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    alert(data.message);
                    mainBalance = data.new_main_balance;
                    document.getElementById('mainBalance').innerText = mainBalance.toFixed(4) + " OPEN";
                    btn.innerText = "CLAIM REWARD";
                    btn.disabled = false;
                } else {
                    alert(data.message);
                    btn.disabled = false;
                    btn.innerText = "CLAIM REWARD";
                }
            })
            .catch(err => {
                console.error(err);
                alert("Server connection failed!");
                btn.disabled = false;
                btn.innerText = "CLAIM REWARD";
            });
        }

        // ब्लॉकचेन ट्रांजैक्शन वेरीफाई करके स्पीड बढ़ाना
        function verifyDeposit() {
            fetch(`${BACKEND_URL}/api/verify-deposit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegram_id: telegramId })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                if(data.success) {
                    miningSpeed = data.new_speed;
                    document.getElementById('speedDisplay').innerText = `Mining Speed: ${miningSpeed.toFixed(4)} OPEN/h`;
                }
            });
        }

        function shareApp() {
            const shareUrl = `https://t.me/share/url?url=https://t.me/OpenWalletApp_2026_bot/app&text=Join%20Open%20Coin!`;
            window.open(shareUrl, '_blank');
        }

        fetchUserData();
    </script>
</body>
</html>
